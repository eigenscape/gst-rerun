[package]
name = "gst-reruntracer"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
description = "gstreamer tracer element for rerun"

[dependencies]
anyhow = "1"
chrono = "0.4"
ctrlc = "3.4"
derive_more = { version = "1", features = ["full"] }
enum_dispatch = "0.3"
glib = "0.20"
gst = { package = 'gstreamer', version = "0.23" }
gst-app = { package = "gstreamer-app", version = "0.23" }
gst-audio = { package = "gstreamer-audio", version = "0.23" }
gst-base = { package = 'gstreamer-base', version = "0.23" }
gst-sys = { package = "gstreamer-sys", version = "0.23" }
gst-utils = { package = "gstreamer-utils", version = "0.23" }
gst-video = { package = "gstreamer-video", version = "0.23" }
hecs = { version = "0.10", features = ["macros", "serde", "row-serialize"] }
log = "0.4"
once_cell = "1"
petgraph = "0.6"
gst-rerun-graph-layout = { path = "../graph-layout" }
rerun = { workspace = true, features = ["native_viewer"] }
ron = "0.8"
test-log = { version = "0.2", features = ["trace"] }
thiserror = "2.0.17"
tokio = "1.48.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "tracing-log",
  "env-filter",
] }

[lib]
# We should add dylib here to allow for hot reloading, but we get a compiler
# issue when building crates that depend on this one
crate-type = ["rlib", "cdylib"]

[build-dependencies]
gst-plugin-version-helper = "0.8"

[dev-dependencies]
tracing = "0.1"
tracing-gstreamer = "0.9.0"
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
